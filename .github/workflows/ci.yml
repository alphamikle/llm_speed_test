name: Cross-platform CLI checks
on:
  push:
    paths-ignore: ['results/**', 'docs/**', 'README.md']
  pull_request:
    paths-ignore: ['results/**', 'docs/**', 'README.md']
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SLLM_SKIP_BROWSER_INSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run check
      - run: npm pack
      - run: npm install -g .
      - run: sllm --help
      - run: sllm doctor --offline
